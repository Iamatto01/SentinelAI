<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="cyberBaseGrad" x1="256" y1="56" x2="256" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="330" y1="140" x2="440" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldBorderGrad" x1="330" y1="140" x2="440" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circuit traces on left -->
  <g stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Trace 1 -->
    <path d="M 60 190 L 120 190 L 155 220" />
    <circle cx="60" cy="190" r="7" fill="#38bdf8" />
    <!-- Trace 2 -->
    <path d="M 90 240 L 140 240" />
    <circle cx="90" cy="240" r="7" fill="#38bdf8" />
    <!-- Trace 3 -->
    <path d="M 40 280 L 110 280 L 135 260" />
    <circle cx="40" cy="280" r="7" fill="#38bdf8" />
  </g>

  <!-- Base geometric emblem -->
  <path d="M 256.0,56.0 L 106.6,273.1 L 43.2,314.0 L 43.2,400.0 L 110.9,425.8 L 256.0,372.1 L 401.1,425.8 L 468.9,400.0 L 468.9,314.0 L 405.4,273.1 Z M 246.3,111.9 L 248.5,193.6 L 199.0,225.8 Z M 265.7,111.9 L 313.0,225.8 L 263.5,193.6 Z M 231.3,111.9 L 177.5,180.7 L 184.0,228.0 Z M 280.7,111.9 L 328.0,228.0 L 334.5,180.7 Z M 164.6,204.3 L 134.5,262.4 L 168.9,243.0 Z M 347.4,204.3 L 343.1,243.0 L 377.5,262.4 Z M 235.6,225.8 L 186.1,251.7 L 186.1,307.5 Z M 276.4,225.8 L 325.9,307.5 L 325.9,251.7 Z M 166.8,264.5 L 128.1,281.8 L 168.9,305.4 Z M 345.2,264.5 L 343.1,305.4 L 383.9,281.8 Z M 246.3,225.8 L 248.5,281.8 L 186.1,382.8 L 184.0,329.1 Z M 265.7,225.8 L 328.0,329.1 L 325.9,382.8 L 263.5,281.8 Z M 117.3,294.6 L 162.5,322.6 L 117.3,350.6 Z M 394.7,294.6 L 394.7,350.6 L 349.5,322.6 Z M 104.4,298.9 L 59.3,322.6 L 59.3,384.9 L 104.4,357.0 Z M 407.6,298.9 L 407.6,357.0 L 452.7,384.9 L 452.7,322.6 Z M 166.8,331.2 L 121.6,359.1 L 166.8,387.1 Z M 345.2,331.2 L 345.2,387.1 L 390.4,359.1 Z M 113.0,365.6 L 63.6,393.6 L 110.9,425.8 L 162.5,395.7 Z M 399.0,365.6 L 349.5,395.7 L 401.1,425.8 L 448.4,393.6 Z" fill="url(#cyberBaseGrad)" fill-rule="evenodd" />

  <!-- Shield on right (Reference Image 2) -->
  <g transform="translate(10, 0)">
    <!-- Circuit lines connecting to shield -->
    <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.85">
      <line x1="390" y1="170" x2="430" y2="150" />
      <circle cx="430" cy="150" r="6" fill="#38bdf8" />
      <line x1="420" y1="210" x2="465" y2="210" />
      <circle cx="465" cy="210" r="6" fill="#38bdf8" />
      <line x1="400" y1="260" x2="445" y2="280" />
      <circle cx="445" cy="280" r="6" fill="#38bdf8" />
    </g>

    <!-- Shield Body -->
    <path d="M 335 150 Q 380 140 405 160 C 405 230 380 270 335 295 C 290 270 265 230 265 160 Q 290 140 335 150 Z"
          fill="url(#shieldGrad)" stroke="url(#shieldBorderGrad)" stroke-width="6" stroke-linejoin="round" />
    <!-- Shield Core Emblem / Radar -->
    <circle cx="335" cy="215" r="16" stroke="#38bdf8" stroke-width="4" fill="#0f172a" />
    <circle cx="335" cy="215" r="5" fill="#38bdf8" />
    <line x1="335" y1="165" x2="335" y2="199" stroke="#38bdf8" stroke-width="3" stroke-dasharray="3 3" />
    <line x1="335" y1="231" x2="335" y2="280" stroke="#38bdf8" stroke-width="3" stroke-dasharray="3 3" />
    <line x1="280" y1="215" x2="319" y2="215" stroke="#38bdf8" stroke-width="3" stroke-dasharray="3 3" />
    <line x1="351" y1="215" x2="390" y2="215" stroke="#38bdf8" stroke-width="3" stroke-dasharray="3 3" />
  </g>

  <!-- Padlock in bottom notch (Reference Image 2) -->
  <g transform="translate(256, 400)">
    <!-- Shackle -->
    <path d="M -14 -12 A 14 14 0 0 1 14 -12 L 14 0 L -14 0 Z"
          fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
    <!-- Lock Body -->
    <rect x="-20" y="0" width="40" height="32" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
    <!-- Keyhole -->
    <circle cx="0" cy="13" r="4.5" fill="#38bdf8" />
    <polygon points="-2,13 2,13 3,23 -3,23" fill="#38bdf8" />
  </g>
</svg>